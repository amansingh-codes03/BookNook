<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In / Register | BookNook</title>
  <meta name="description" content="Sign in or register your BookNook reader account to save wishlists and track orders." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .auth-card-wrap {
      max-width: 460px;
      margin: 3.5rem auto;
      background: var(--white);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }
    .auth-tabs-row {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      background: var(--cream-dark);
    }
    .auth-tab-btn {
      flex: 1;
      padding: 1rem;
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-muted);
      transition: var(--transition);
      cursor: pointer;
    }
    .auth-tab-btn.active {
      background: var(--white);
      color: var(--primary-dark);
      border-bottom: 2px solid var(--primary);
    }
    .password-wrap {
      position: relative;
    }
    .password-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--text-light);
    }
    .demo-accounts-card {
      background: var(--cream);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>

  <!-- Injected Shared Header -->
  <div id="shared-header"></div>

  <!-- Breadcrumbs -->
  <div class="breadcrumb-bar">
    <div class="container">
      <ul class="breadcrumb-list">
        <li><a href="index.html">Home</a></li>
        <li class="breadcrumb-separator">&rsaquo;</li>
        <li class="breadcrumb-current">Reader Authentication</li>
      </ul>
    </div>
  </div>

  <main class="container">
    <div class="auth-card-wrap">
      <!-- Tabs for Login / Register -->
      <div class="auth-tabs-row">
        <button type="button" class="auth-tab-btn active" id="tabLogin">Sign In</button>
        <button type="button" class="auth-tab-btn" id="tabRegister">New Reader Registration</button>
      </div>

      <div style="padding: 2rem;">
        <!-- Section 1: Sign In -->
        <div id="loginSection">
          <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="font-size: 2rem; margin-bottom: 0.4rem;">📚</div>
            <h2 style="font-family: var(--font-serif); font-size: 1.6rem; color: var(--primary-dark);">Welcome Back</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem;">Sign in to access your saved wishlist and tracked orders</p>
          </div>

          <div id="loginErrorMessage" style="display: none; background: #FEF2F2; border: 1px solid #FCA5A5; color: var(--danger); padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1rem; text-align: center;"></div>

          <form id="loginForm">
            <div class="form-group">
              <label class="form-label" for="loginEmail">Email Address</label>
              <input type="email" id="loginEmail" class="form-input" placeholder="e.g. ananya@booknook.in" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="loginPassword">Password</label>
              <div class="password-wrap">
                <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required />
                <span class="password-toggle-btn" title="Toggle password visibility">👁</span>
              </div>
            </div>

            <div style="margin-top: 1.5rem;">
              <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In to BookNook &rarr;</button>
            </div>
          </form>

          <!-- Quick Demo Logins for Evaluation -->
          <div class="demo-accounts-card">
            <div style="font-size: 0.82rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px;">
              ⚡ One-Click Demo Personas:
            </div>
            <div style="display: flex; flex-direction: column; gap: 0.4rem;">
              <button type="button" class="btn btn-outline btn-sm" onclick="loginAsDemo(0)" style="font-size: 0.82rem; justify-content: flex-start;">
                👤 Ananya Sharma (Avid Reader) &bull; Bengaluru
              </button>
              <button type="button" class="btn btn-outline btn-sm" onclick="loginAsDemo(1)" style="font-size: 0.82rem; justify-content: flex-start;">
                🎓 Rahul Verma (Student) &bull; Delhi
              </button>
            </div>
            <div style="font-size: 0.72rem; color: var(--text-light); margin-top: 0.5rem;">
              Password: <code>password123</code> (Simulated localStorage auth)
            </div>
          </div>
        </div>

        <!-- Section 2: Register -->
        <div id="registerSection" style="display: none;">
          <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="font-size: 2rem; margin-bottom: 0.4rem;">🌿</div>
            <h2 style="font-family: var(--font-serif); font-size: 1.6rem; color: var(--primary-dark);">Join BookNook</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem;">Create your personal literary sanctuary with us</p>
          </div>

          <div id="regErrorMessage" style="display: none; background: #FEF2F2; border: 1px solid #FCA5A5; color: var(--danger); padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1rem; text-align: center;"></div>

          <form id="registerForm">
            <div class="form-group">
              <label class="form-label" for="regName">Full Name</label>
              <input type="text" id="regName" class="form-input" placeholder="e.g. Vikram Malhotra" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="regEmail">Email Address</label>
              <input type="email" id="regEmail" class="form-input" placeholder="vikram@example.com" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="regPassword">Password (Min 6 characters)</label>
              <div class="password-wrap">
                <input type="password" id="regPassword" class="form-input" placeholder="••••••••" minlength="6" required />
                <span class="password-toggle-btn">👁</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="regConfirmPassword">Confirm Password</label>
              <div class="password-wrap">
                <input type="password" id="regConfirmPassword" class="form-input" placeholder="••••••••" minlength="6" required />
                <span class="password-toggle-btn">👁</span>
              </div>
            </div>

            <div style="margin-top: 1.5rem;">
              <button type="submit" class="btn btn-primary btn-block btn-lg">Create Reader Account &rarr;</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- Injected Shared Footer -->
  <div id="shared-footer"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
